<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base de connaissance</title>
<style>
  :root {
    --fond:       #f4f5fb;
    --carte:      #ffffff;
    --trait:      #e5e6f0;
    --texte:      #1c1b2e;
    --attenue:    #6b6a86;
    --doux:       #9998b3;

    --violet:     #6246ea;
    --violet-pale:#efecff;
    --vert:       #0f9d6e;
    --vert-pale:  #e3f7ef;
    --ambre:      #c77a10;
    --ambre-pale: #fdf2dd;
    --rose:       #d63b5e;
    --rose-pale:  #fdeaef;
    --bleu:       #1f7ae0;
    --bleu-pale:  #e6f1fd;

    --ombre:      0 1px 2px rgba(28,27,46,.05), 0 4px 14px rgba(28,27,46,.05);
    --ombre-fort: 0 2px 6px rgba(28,27,46,.08), 0 12px 32px rgba(28,27,46,.10);
    --rayon:      14px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --fond:       #131322;
      --carte:      #1c1c30;
      --trait:      #2c2c46;
      --texte:      #edecf7;
      --attenue:    #a3a1c0;
      --doux:       #75739a;
      --violet-pale:#251f4d;
      --vert-pale:  #10352a;
      --ambre-pale: #3a2c10;
      --rose-pale:  #3d1a26;
      --bleu-pale:  #142b47;
      --ombre:      0 1px 2px rgba(0,0,0,.4);
      --ombre-fort: 0 12px 32px rgba(0,0,0,.5);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--fond);
    color: var(--texte);
    font: 15px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Bandeau ---------- */

  .bandeau {
    background: linear-gradient(135deg, #6246ea 0%, #8b5cf6 45%, #c026d3 100%);
    color: #fff;
    padding: 34px 32px 30px;
  }
  .bandeau-interne { max-width: 1240px; margin: 0 auto; }

  h1 {
    margin: 0 0 6px;
    font-size: 27px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .accroche { opacity: .88; font-size: 14px; margin-bottom: 24px; max-width: 620px; }

  .tuiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
    gap: 12px;
    margin-bottom: 22px;
  }
  .tuile {
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 12px;
    padding: 13px 16px;
    backdrop-filter: blur(6px);
  }
  .tuile .chiffre { font-size: 27px; font-weight: 700; line-height: 1.15; }
  .tuile .libelle { font-size: 11px; opacity: .85; text-transform: uppercase; letter-spacing: .07em; }

  .jauge {
    height: 9px;
    border-radius: 99px;
    background: rgba(255,255,255,.22);
    overflow: hidden;
    display: flex;
  }
  .jauge span { display: block; height: 100%; transition: width .5s ease; }
  .jauge .part-enrichi    { background: #4ade80; }
  .jauge .part-non_trouve { background: #fbbf24; }
  .jauge .part-echec      { background: #fb7185; }

  .legende {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    font-size: 12px;
    opacity: .92;
    margin-top: 9px;
  }
  .legende i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; margin-right: 6px; }

  /* ---------- Barre de contrôles ---------- */

  .controles {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--carte);
    border-bottom: 1px solid var(--trait);
    padding: 14px 32px;
    box-shadow: var(--ombre);
  }
  .controles-interne {
    max-width: 1240px;
    margin: 0 auto;
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    align-items: center;
  }

  .pilule {
    font: inherit;
    font-size: 13px;
    font-weight: 550;
    padding: 7px 15px;
    border: 1.5px solid var(--trait);
    border-radius: 99px;
    background: transparent;
    color: var(--attenue);
    cursor: pointer;
    transition: all .15s;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .pilule:hover { border-color: var(--violet); color: var(--violet); transform: translateY(-1px); }
  .pilule .compte {
    font-size: 11px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 99px;
    background: var(--trait);
    color: var(--attenue);
  }
  .pilule.actif { background: var(--violet); border-color: var(--violet); color: #fff; }
  .pilule.actif .compte { background: rgba(255,255,255,.26); color: #fff; }

  .champ-recherche { position: relative; margin-left: auto; }
  .champ-recherche input {
    font: inherit;
    font-size: 13.5px;
    padding: 9px 15px 9px 38px;
    border: 1.5px solid var(--trait);
    border-radius: 99px;
    background: var(--fond);
    color: var(--texte);
    width: 300px;
    transition: all .15s;
  }
  .champ-recherche input:focus {
    outline: none;
    border-color: var(--violet);
    background: var(--carte);
    box-shadow: 0 0 0 4px var(--violet-pale);
  }
  .champ-recherche svg {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    color: var(--doux);
    pointer-events: none;
  }

  .filtre-actif {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--attenue);
    width: 100%;
  }
  .filtre-actif button {
    font: inherit;
    font-size: 12px;
    border: none;
    background: var(--violet-pale);
    color: var(--violet);
    padding: 3px 10px;
    border-radius: 99px;
    cursor: pointer;
    font-weight: 600;
  }
  .filtre-actif button:hover { background: var(--violet); color: #fff; }

  /* ---------- Cartes ---------- */

  main { padding: 24px 32px 70px; max-width: 1240px; margin: 0 auto; }

  .carte {
    background: var(--carte);
    border: 1px solid var(--trait);
    border-left: 4px solid var(--doux);
    border-radius: var(--rayon);
    padding: 20px 22px;
    margin-bottom: 15px;
    box-shadow: var(--ombre);
    transition: box-shadow .18s, transform .18s;
  }
  .carte:hover { box-shadow: var(--ombre-fort); transform: translateY(-2px); }
  .carte.enrichi    { border-left-color: var(--vert); }
  .carte.non_trouve { border-left-color: var(--ambre); }
  .carte.echec      { border-left-color: var(--rose); }
  .carte.en_attente { border-left-color: var(--doux); }

  .entete { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  .nom { font-weight: 650; font-size: 16.5px; flex: 1; min-width: 220px; letter-spacing: -.01em; }

  .badge {
    font-size: 11px;
    padding: 4px 11px;
    border-radius: 99px;
    font-weight: 650;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 99px; background: currentColor; }
  .badge.enrichi    { background: var(--vert-pale);  color: var(--vert); }
  .badge.non_trouve { background: var(--ambre-pale); color: var(--ambre); }
  .badge.echec      { background: var(--rose-pale);  color: var(--rose); }
  .badge.en_attente { background: var(--trait);      color: var(--attenue); }

  .etiquettes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .etiquette {
    font: inherit;
    font-size: 11.5px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 7px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all .13s;
  }
  .etiquette:hover { transform: translateY(-1px); filter: brightness(.94); }

  .note-humaine {
    margin-top: 14px;
    font-size: 13.5px;
    padding: 12px 15px;
    background: var(--ambre-pale);
    border-radius: 10px;
    border: 1px solid color-mix(in srgb, var(--ambre) 22%, transparent);
  }
  .note-humaine strong {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--ambre);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 5px;
  }

  .resume {
    margin-top: 14px;
    font-size: 14.5px;
    line-height: 1.68;
    padding: 14px 17px;
    background: var(--vert-pale);
    border-radius: 10px;
    border: 1px solid color-mix(in srgb, var(--vert) 20%, transparent);
  }
  .resume strong {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--vert);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }

  details.source { margin-top: 12px; }
  details.source summary {
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--bleu);
    padding: 7px 13px;
    background: var(--bleu-pale);
    border-radius: 8px;
    list-style: none;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    user-select: none;
    transition: all .13s;
  }
  details.source summary::-webkit-details-marker { display: none; }
  details.source summary:hover { filter: brightness(.96); }
  details.source summary::before { content: '▸'; transition: transform .18s; }
  details.source[open] summary::before { transform: rotate(90deg); }

  .brut {
    margin-top: 9px;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 12px;
    line-height: 1.6;
    max-height: 260px;
    overflow-y: auto;
    padding: 13px 15px;
    border-radius: 10px;
    background: var(--fond);
    border: 1px solid var(--trait);
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--attenue);
  }

  .pied {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed var(--trait);
    font-size: 12.5px;
    color: var(--attenue);
    display: flex;
    gap: 8px 18px;
    flex-wrap: wrap;
    align-items: center;
  }
  .pied a {
    color: var(--violet);
    text-decoration: none;
    font-weight: 550;
    word-break: break-all;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .pied a:hover { text-decoration: underline; }
  .puce { color: var(--doux); }

  .score { display: inline-flex; align-items: center; gap: 6px; }
  .score-barre { width: 46px; height: 6px; border-radius: 99px; background: var(--trait); overflow: hidden; }
  .score-barre span { display: block; height: 100%; background: var(--vert); }

  .message {
    padding: 70px 20px;
    text-align: center;
    color: var(--attenue);
    background: var(--carte);
    border-radius: var(--rayon);
    border: 1px dashed var(--trait);
  }
  .message .grand { font-size: 34px; margin-bottom: 10px; }
  .vide { color: var(--doux); font-style: italic; }

  @media (max-width: 720px) {
    .bandeau, .controles, main { padding-left: 18px; padding-right: 18px; }
    .champ-recherche { margin-left: 0; width: 100%; }
    .champ-recherche input { width: 100%; }
  }
</style>
</head>
<body>

<div class="bandeau">
  <div class="bandeau-interne">
    <h1>Base de connaissance</h1>
    <p class="accroche">
      Champs vides complétés par recherche web réelle. Chaque ajout renvoie à la page
      dont il provient — rien n'est écrit sans source vérifiable.
    </p>
    <div class="tuiles" id="tuiles"></div>
    <div class="jauge" id="jauge"></div>
    <div class="legende" id="legende"></div>
  </div>
</div>

<div class="controles">
  <div class="controles-interne" id="controles">
    <button class="pilule actif" data-filtre="tous">Tout <span class="compte">0</span></button>
    <button class="pilule" data-filtre="enrichi">Enrichies <span class="compte">0</span></button>
    <button class="pilule" data-filtre="non_trouve">Sans source <span class="compte">0</span></button>
    <button class="pilule" data-filtre="en_attente">En attente <span class="compte">0</span></button>
    <button class="pilule" data-filtre="echec">Échecs <span class="compte">0</span></button>

    <div class="champ-recherche">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input type="search" id="recherche" placeholder="Rechercher un nom, un texte, une étiquette…">
    </div>

    <div class="filtre-actif" id="filtre-etiquette" hidden></div>
  </div>
</div>

<main id="liste"><div class="message"><div class="grand">⏳</div>Chargement des données…</div></main>

<script>
const LIBELLES = {
  enrichi:    'enrichi',
  non_trouve: 'sans source',
  echec:      'échec',
  en_attente: 'en attente',
};

// Teintes attribuées de façon stable à chaque étiquette : la même
// étiquette garde sa couleur d'une session à l'autre.
const TEINTES = [
  ['#6246ea', '#efecff'], ['#0f9d6e', '#e3f7ef'], ['#c77a10', '#fdf2dd'],
  ['#d63b5e', '#fdeaef'], ['#1f7ae0', '#e6f1fd'], ['#8b3fc7', '#f5eafc'],
  ['#0d8a8a', '#e0f5f5'], ['#b1441f', '#fdece5'],
];

function teinte(etiquette) {
  let h = 0;
  for (const c of etiquette) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return TEINTES[h % TEINTES.length];
}

let lignes = [];
let filtre = 'tous';
let requete = '';
let etiquetteChoisie = null;

const echapper = (s) => String(s ?? '').replace(/[&<>"]/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Quelques lignes du CSV portent une URL en guise de nom, parfois tres
// longue (parametres de tracking). On affiche une forme lisible, la valeur
// complete restant accessible au survol.
function nomLisible(nom) {
  if (!nom) return '(sans nom)';
  if (!/^https?:\/\//i.test(nom)) return nom;
  try {
    const u = new URL(nom);
    const chemin = u.pathname.replace(/\/$/, '');
    const court = u.hostname.replace(/^www\./, '') + (chemin.length > 1 ? chemin : '');
    return court.length > 60 ? court.slice(0, 60) + '…' : court;
  } catch {
    return nom.length > 60 ? nom.slice(0, 60) + '…' : nom;
  }
}

function afficherEntete() {
  const par = lignes.reduce((a, l) => (a[l.statut] = (a[l.statut] ?? 0) + 1, a), {});
  const champs = lignes.reduce((n, l) => n + (l.champs_enrichis?.length ?? 0), 0);
  const total = lignes.length || 1;

  document.getElementById('tuiles').innerHTML = [
    ['Lignes', lignes.length],
    ['Enrichies', par.enrichi ?? 0],
    ['Sans source', par.non_trouve ?? 0],
    ['Champs complétés', champs],
  ].map(([libelle, chiffre]) =>
    `<div class="tuile"><div class="chiffre">${chiffre}</div><div class="libelle">${libelle}</div></div>`
  ).join('');

  document.getElementById('jauge').innerHTML = ['enrichi', 'non_trouve', 'echec']
    .map((s) => `<span class="part-${s}" style="width:${((par[s] ?? 0) / total * 100).toFixed(1)}%"></span>`)
    .join('');

  const couleurs = { enrichi: '#4ade80', non_trouve: '#fbbf24', echec: '#fb7185' };
  document.getElementById('legende').innerHTML = Object.entries(couleurs)
    .map(([s, c]) =>
      `<span><i style="background:${c}"></i>${LIBELLES[s]} · ${par[s] ?? 0}</span>`)
    .join('') + `<span><i style="background:rgba(255,255,255,.3)"></i>en attente · ${par.en_attente ?? 0}</span>`;

  document.querySelectorAll('.pilule').forEach((b) => {
    const f = b.dataset.filtre;
    b.querySelector('.compte').textContent = f === 'tous' ? lignes.length : (par[f] ?? 0);
  });
}

function carte(l) {
  const etiquettes = (l.etiquettes ?? []).map((e) => {
    const [avant, fond] = teinte(e);
    return `<button class="etiquette" data-etiquette="${echapper(e)}"
              style="background:${fond};color:${avant};border-color:${avant}33">${echapper(e)}</button>`;
  }).join('');

  const note = l.note_alex ? `
    <div class="note-humaine">
      <strong>✍️ Note humaine — saisie manuellement</strong>
      ${echapper(l.note_alex)}
    </div>` : '';

  const resume = l.resume ? `
    <div class="resume">
      <strong>✨ Résumé — reformulé par ${echapper(l.resume_modele ?? 'le modèle')}</strong>
      ${echapper(l.resume)}
    </div>` : '';

  const brut = l.texte ? `
    <details class="source">
      <summary>Voir le texte source brut, non reformulé</summary>
      <div class="brut">${echapper(l.texte)}</div>
    </details>` : '';

  const pieces = [];
  const lien = l.source_url || l.url;
  if (lien) {
    pieces.push(`<a href="${echapper(lien)}" target="_blank" rel="noopener">
      🔗 ${echapper((l.source_titre || lien).slice(0, 66))}</a>`);
  }
  if (l.pertinence != null) {
    const pc = Math.round(Number(l.pertinence) * 100);
    pieces.push(`<span class="score">Pertinence
      <span class="score-barre"><span style="width:${pc}%"></span></span>
      ${(Number(l.pertinence)).toFixed(2)}</span>`);
  }
  if (l.champs_enrichis?.length) pieces.push(`Complété : <strong>${l.champs_enrichis.join(', ')}</strong>`);
  if (l.erreur) pieces.push(`<span style="color:var(--rose)">${echapper(l.erreur)}</span>`);

  const pied = pieces.length
    ? `<div class="pied">${pieces.join('<span class="puce">·</span>')}</div>` : '';

  const rienDuTout = !note && !resume && !brut && !pied;

  return `
    <article class="carte ${l.statut}">
      <div class="entete">
        <div class="nom" title="${echapper(l.nom ?? '')}">${echapper(nomLisible(l.nom))}</div>
        <span class="badge ${l.statut}">${LIBELLES[l.statut] ?? l.statut}</span>
      </div>
      ${etiquettes ? `<div class="etiquettes">${etiquettes}</div>` : ''}
      ${note}${resume}${brut}${pied}
      ${rienDuTout ? '<div class="pied vide">Aucune information disponible pour cette ligne.</div>' : ''}
    </article>`;
}

function rendre() {
  const q = requete.trim().toLowerCase();

  const visibles = lignes.filter((l) => {
    if (filtre !== 'tous' && l.statut !== filtre) return false;
    if (etiquetteChoisie && !(l.etiquettes ?? []).includes(etiquetteChoisie)) return false;
    if (!q) return true;
    return [l.nom, l.texte, l.resume, l.note_alex, (l.etiquettes ?? []).join(' ')]
      .join(' ').toLowerCase().includes(q);
  });

  document.getElementById('liste').innerHTML = visibles.length
    ? visibles.map(carte).join('')
    : `<div class="message"><div class="grand">🔍</div>Aucune ligne ne correspond à ces critères.</div>`;

  document.querySelectorAll('.etiquette').forEach((b) => {
    b.addEventListener('click', () => {
      etiquetteChoisie = b.dataset.etiquette;
      majFiltreEtiquette();
      rendre();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

function majFiltreEtiquette() {
  const zone = document.getElementById('filtre-etiquette');
  zone.hidden = !etiquetteChoisie;
  if (etiquetteChoisie) {
    zone.innerHTML = `Filtré sur l'étiquette « <strong>${echapper(etiquetteChoisie)}</strong> »
      <button id="retirer-etiquette">✕ retirer</button>`;
    document.getElementById('retirer-etiquette').addEventListener('click', () => {
      etiquetteChoisie = null;
      majFiltreEtiquette();
      rendre();
    });
  }
}

document.querySelectorAll('.pilule').forEach((b) => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.pilule').forEach((x) => x.classList.remove('actif'));
    b.classList.add('actif');
    filtre = b.dataset.filtre;
    rendre();
  });
});

document.getElementById('recherche').addEventListener('input', (e) => {
  requete = e.target.value;
  rendre();
});

fetch('/api/lignes')
  .then((r) => r.json())
  .then((data) => {
    if (data.erreur) throw new Error(data.erreur);
    lignes = data;
    afficherEntete();
    rendre();
  })
  .catch((e) => {
    document.getElementById('liste').innerHTML =
      `<div class="message"><div class="grand">⚠️</div>Chargement impossible : ${echapper(e.message)}</div>`;
  });
</script>
</body>
</html>
