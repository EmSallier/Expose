document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

city:{{ voileOpacite }}; background:linear-gradient(180deg, rgba(20,23,26,.84) 0%, rgba(20,23,26,.68) 55%, rgba(20,23,26,.52) 100%);\"><\u002Fdiv>\n    <div style=\"position:relative; max-width:1180px; margin:0 auto; pointer-events:none; opacity:{{ contenuOpacite }};\">\n      <h1 style=\"margin:0 0 10px; font:400 34px/1.15 var(--serif); letter-spacing:-.01em; pointer-events:none; text-align:center;\">Base de connaissance<\u002Fh1>\n      <p style=\"margin:0 auto 30px; max-width:600px; text-align:center; font-size:14.5px; line-height:1.65; color:rgba(243,239,232,.82); pointer-events:none;\">Champs vides complétés par recherche web réelle. Chaque ajout renvoie à la page dont il provient — rien n'est écrit sans source vérifiable.<\u002Fp>\n\n      <sc-if value=\"{{ tuilesVisibles }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1px; background:rgba(243,239,232,.2); border:1px solid rgba(243,239,232,.2); margin-bottom:26px; pointer-events:none;\">\n          <sc-for list=\"{{ tuiles }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <div style=\"background:rgba(16,19,22,.62); padding:16px 18px;\">\n              <div style=\"font:400 30px/1.1 var(--serif);\">{{ t.chiffre }}<\u002Fdiv>\n              <div style=\"font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:rgba(243,239,232,.7); margin-top:4px;\">{{ t.libelle }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"height:3px; display:flex; background:rgba(243,239,232,.22); overflow:hidden; pointer-events:none;\">\n        <sc-for list=\"{{ jauge }}\" as=\"j\" hint-placeholder-count=\"3\">\n          <span style=\"display:block; height:100%; background:{{ j.couleur }}; width:{{ j.largeur }};\"><\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:20px; flex-wrap:wrap; font-size:12px; color:rgba(243,239,232,.82); margin-top:11px; pointer-events:none;\">\n        <sc-for list=\"{{ legende }}\" as=\"g\" hint-placeholder-count=\"4\">\n          <span style=\"display:inline-flex; align-items:center; gap:7px;\"><i style=\"width:7px; height:7px; border-radius:50%; display:inline-block; background:{{ g.couleur }};\"><\u002Fi>{{ g.texte }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:26px; pointer-events:auto;\">\n        <button sc-camel-on-click=\"{{ onEnrichir }}\" style=\"font:600 13px/1.3 var(--sans); white-space:nowrap; padding:10px 18px; border:1px solid var(--encre-texte); border-radius:4px; background:var(--encre-texte); color:var(--encre); cursor:pointer; display:inline-flex; align-items:center; gap:8px;\" style-hover=\"opacity:.86\">Compléter les champs vides<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ onReessayer }}\" style=\"font:600 13px/1.3 var(--sans); white-space:nowrap; padding:10px 18px; border:1px solid rgba(243,239,232,.34); border-radius:4px; background:transparent; color:var(--encre-texte); cursor:pointer;\" style-hover=\"border-color:var(--encre-texte)\">Réessayer les sans source<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ onToggleAjout }}\" style=\"font:600 13px/1.3 var(--sans); white-space:nowrap; padding:10px 18px; border:1px solid rgba(243,239,232,.34); border-radius:4px; background:transparent; color:var(--encre-texte); cursor:pointer;\" style-hover=\"border-color:var(--encre-texte)\">Ajouter une adresse<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ onIndexer }}\" style=\"font:600 13px/1.3 var(--sans); white-space:nowrap; padding:10px 18px; border:1px solid rgba(243,239,232,.34); border-radius:4px; background:transparent; color:var(--encre-texte); cursor:pointer;\" style-hover=\"border-color:var(--encre-texte)\">Indexer pour le chatbot<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ onOuvrirDiscussion }}\" style=\"font:600 13px/1.3 var(--sans); white-space:nowrap; padding:10px 18px; border:1px solid var(--encre-texte); border-radius:4px; background:var(--encre-texte); color:var(--encre); cursor:pointer;\" style-hover=\"opacity:.86\">Interroger la base<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ onRecharger }}\" style=\"font:600 13px/1.3 var(--sans); white-space:nowrap; padding:10px 18px; border:1px solid rgba(243,239,232,.34); border-radius:4px; background:transparent; color:var(--encre-texte); cursor:pointer;\" style-hover=\"border-color:var(--encre-texte)\">Recharger<\u002Fbutton>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ ajoutOuvert }}\" hint-placeholder-val=\"{{ false }}\">\n        <form sc-camel-on-submit=\"{{ onSubmitAjout }}\" style=\"margin-top:14px; padding:16px; border:1px solid rgba(243,239,232,.22); pointer-events:auto; display:grid; grid-template-columns:1fr 1.4fr auto; gap:10px; align-items:center;\">\n          <input value=\"{{ ajoutNom }}\" sc-camel-on-input=\"{{ onAjoutNom }}\" placeholder=\"Nom du sujet (facultatif si adresse fournie)\" style=\"font:400 13.5px/1.4 var(--sans); padding:11px 13px; border:1px solid rgba(243,239,232,.3); border-radius:4px; background:rgba(243,239,232,.06); color:var(--encre-texte); min-width:0;\">\n          <input value=\"{{ ajoutUrl }}\" sc-camel-on-input=\"{{ onAjoutUrl }}\" type=\"url\" placeholder=\"https://adresse-de-la-page.com\" style=\"font:400 13.5px/1.4 var(--sans); padding:11px 13px; border:1px solid rgba(243,239,232,.3); border-radius:4px; background:rgba(243,239,232,.06); color:var(--encre-texte); min-width:0;\">\n          <button type=\"submit\" style=\"font:600 13px/1.3 var(--sans); white-space:nowrap; padding:10px 18px; border:none; border-radius:4px; background:var(--encre-texte); color:var(--encre); cursor:pointer;\">Ajouter et compléter<\u002Fbutton>\n        <\u002Fform>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ avancement }}\" hint-placeholder-val=\"{{ false }}\">\n px 16px; border-radius:4px; background:var(--fond); border:1px solid var(--trait); white-space:pre-wrap; word-break:break-word; color:var(--attenue);\">{{ l.texte }}<\u002Fdiv>\n          <\u002Fdetails>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ l.aPied }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px; padding-top:13px; border-top:1px solid var(--trait); font-size:12.5px; color:var(--attenue); display:flex; gap:8px 20px; flex-wrap:wrap; align-items:center;\">\n            <sc-if value=\"{{ l.lien }}\" hint-placeholder-val=\"{{ false }}\">\n              <a href=\"{{ l.lien }}\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent); text-decoration:none; font-weight:500; word-break:break-all;\">{{ l.lienLibelle }}<\u002Fa>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ l.pertinenceVisible }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"display:inline-flex; align-items:center; gap:8px;\">Pertinence<span style=\"width:44px; height:3px; background:var(--trait); overflow:hidden; display:inline-block;\"><span style=\"display:block; height:100%; background:var(--vert); width:{{ l.pertinencePc }};\"><\u002Fspan><\u002Fspan>{{ l.pertinenceTxt }}<\u002Fspan>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ l.champs }}\" hint-placeholder-val=\"{{ false }}\">\n              <span>Complété : <strong style=\"color:var(--texte); font-weight:600;\">{{ l.champs }}<\u002Fstrong><\u002Fspan>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ l.erreur }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"color:var(--rose);\">{{ l.erreur }}<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ l.rien }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px; padding-top:13px; border-top:1px solid var(--trait); font-size:12.5px; color:var(--doux); font-style:italic;\">Aucune information disponible pour cette ligne.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start;\">\n          <details style=\"flex:1;\">\n            <summary style=\"cursor:pointer; font:500 12.5px/1.4 var(--sans); color:var(--accent); padding:7px 12px; background:var(--accent-pale); border-radius:3px; display:inline-block; user-select:none;\">{{ l.relanceLibelle }}<\u002Fsummary>\n            <div style=\"display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;\">\n              <input type=\"url\" placeholder=\"https://…\" value=\"{{ l.urlValue }}\" sc-camel-on-input=\"{{ l.onUrl }}\" style=\"font:400 13px/1.4 var(--sans); padding:9px 13px; border-radius:3px; border:1px solid var(--trait); background:var(--fond); color:var(--texte); flex:1; min-width:230px;\" style-focus=\"outline:none; border-color:var(--accent)\">\n              <button sc-camel-on-click=\"{{ l.onRelancer }}\" style=\"font:600 12.5px/1.3 var(--sans); padding:8px 16px; border-radius:3px; border:1px solid var(--accent); background:var(--accent); color:var(--carte); cursor:pointer;\" style-hover=\"opacity:.88\">Compléter depuis cette page<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ l.etat }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:12.5px; margin-top:8px; color:var(--attenue);\">{{ l.etat }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdetails>\n          <sc-if value=\"{{ l.supprimable }}\" hint-placeholder-val=\"{{ true }}\">\n            <button sc-camel-on-click=\"{{ l.onDemanderSuppression }}\" style=\"font:500 12.5px/1.3 var(--sans); padding:7px 12px; border-radius:3px; border:1px solid transparent; background:transparent; color:var(--doux); cursor:pointer; margin-left:auto;\" style-hover=\"color:var(--rose); border-color:var(--rose)\">Supprimer<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ l.confirmOuvert }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; gap:10px; align-items:center; flex-wrap:wrap; width:100%; margin-top:6px; padding:12px 14px; background:var(--rose-pale); border-radius:4px; font-size:12.5px; color:var(--rose);\">\n              <span style=\"flex:1; min-width:190px; line-height:1.5;\">Supprimer <strong style=\"font-weight:600;\">{{ l.nom }}<\u002Fstrong> définitivement ? Cette action est irréversible.<\u002Fspan>\n              <button sc-camel-on-click=\"{{ l.onConfirmer }}\" style=\"font:600 12.5px/1.3 var(--sans); padding:7px 14px; border-radius:3px; border:none; background:var(--rose); color:var(--carte); cursor:pointer;\">Supprimer<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ l.onAnnuler }}\" style=\"font:600 12.5px/1.3 var(--sans); padding:7px 14px; border-radius:3px; border:1px solid var(--trait); background:var(--carte); color:var(--attenue); cursor:pointer;\">Annuler<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fsc-for>\n\n    <sc-if value=\"{{ aucunResultat }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:80px 20px; text-align:center; color:var(--attenue); background:var(--carte); border:1px solid var(--trait); border-radius:var(--rayon); font:400 17px/1.5 var(--serif);\">Aucune ligne ne correspond à ces critères.<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n  <sc-if value=\"{{ discussion }}\" hint-placeholder-val=\"{{ false }}\">\n    <div>\n      <div sc-camel-on-click=\"{{ onFermerDiscussion }}\" style=\"position:fixed; inset:0; background:rgba(20,23,26,.42); z-index:40;\"><\u002Fdiv>\n      <aside style=\"position:fixed; top:0; right:0; bottom:0; width:min(540px,100%); background:var(--carte); border-left:1px solid var(--trait); box-shadow:-14px 0 44px rgba(20,23,26,.2); z-index:50; display:flex; flex-direction:column;\">\n        <div style=\"padding:22px 24px; background:var(--encre); color:var(--encre-texte); display:flex; align-items:flex-start; gap:14px;\">\n          <div style=\"flex:1;\">\n            <h2 style=\"margin:0 0 5px; font:400 22px/1.2 var(--serif);\">Interroger la base<\u002Fh2>\n            <p style=\"margin:0; font-size:12.5px; line-height:1.55; color:rgba(243,239,232,.7);\">La question est convertie en vecteur, les lignes les plus proches sont récupérées, et la réponse ne s'appuie que sur elles.<\u002Fp>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ onFermerDiscussion }}\" aria-label=\"Fermer\" style=\"font:400 17px/1 var(--sans); background:transparent; color:var(--encre-texte); border:1px solid rgba(243,239,232,.3); border-radius:3px; width:32px; height:32px; cursor:pointer; flex-shrink:0;\">✕<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"flex:1; overflow-y:auto; padding:22px 24px; display:flex; flex-direction:column; gap:16px;\">\n          <div style=\"align-self:flex-end; max-width:88%; font-size:14px; line-height:1.6; background:var(--accent); color:var(--carte); padding:11px 15px; border-radius:4px;\">Quels artistes travaillent sur la surveillance ?<\u002Fdiv>\n          <div style=\"align-self:flex-start; max-width:92%; font-size:14px; line-height:1.65; background:var(--fond); border:1px solid var(--trait); padding:14px 16px; border-radius:4px;\">\n            <div style=\"font-size:10px; text-transform:uppercase; letter-spacing:.1em; font-weight:600; color:var(--vert); margin-bottom:8px;\">Réponse issue de ta base<\u002Fdiv>\n            Plusieurs artistes de la base touchent à ces sujets : Marta Revuelta (profilage biométrique, Genève), Adam Harvey (CV Dazzle, camouflage anti-reconnaissance faciale) et Sarah Ciston (AI War Cloud Database).\n            <div style=\"margin-top:13px; padding-top:11px; border-top:1px solid var(--trait);\">\n              <div style=\"font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--attenue); font-weight:600; margin-bottom:7px;\">Lignes utilisées<\u002Fdiv>\n              <div style=\"font-size:12.5px; margin-bottom:5px;\"><a href=\"#\" style=\"color:var(--accent); text-decoration:none; font-weight:500;\">Marta Revuelta — Media Artist<\u002Fa> <span style=\"color:var(--doux); font-size:11.5px;\">· proximité 0.86<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:12.5px;\"><a href=\"#\" style=\"color:var(--accent); text-decoration:none; font-weight:500;\">Adam Harvey — Anti-Fragile Sycophants<\u002Fa> <span style=\"color:var(--doux); font-size:11.5px;\">· proximité 0.81<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"align-self:flex-end; max-width:88%; font-size:14px; line-height:1.6; background:var(--accent); color:var(--carte); padding:11px 15px; border-radius:4px;\">Et sur les imprimantes 3D résine grand format ?<\u002Fdiv>\n          <div style=\"align-self:flex-start; max-width:92%; font-size:14px; line-height:1.65; background:var(--bleu-pale); border:1px solid var(--trait); padding:14px 16px; border-radius:4px;\">\n            <div style=\"font-size:10px; text-transform:uppercase; letter-spacing:.1em; font-weight:600; color:var(--bleu); margin-bottom:8px;\">Réponse trouvée sur le web — absente de ta base<\u002Fdiv>\n            Trois modèles reviennent : la Formlabs Form 4L, la Peopoly Phenom XXL et la Elegoo Jupiter SE. Les extraits comparent volumes d'impression et prix.\n            <div style=\"margin-top:13px; padding-top:11px; border-top:1px solid var(--trait);\">\n              <div style=\"font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--attenue); font-weight:600; margin-bottom:7px;\">Pages web citées<\u002Fdiv>\n              <div style=\"font-size:12.5px;\"><a href=\"#\" style=\"color:var(--accent); text-decoration:none; font-weight:500;\">Comparaison des imprimantes 3D résine grand format<\u002Fa> <span style=\"color:var(--doux); font-size:11.5px;\">· pertinence 0.82<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:14px; padding-top:12px; border-top:1px solid var(--trait);\">\n              <div style=\"font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--attenue); font-weight:600; margin-bottom:9px;\">Ajouter à la base ?<\u002Fdiv>\n              <div style=\"display:flex; gap:10px; align-items:center; padding:10px 12px; margin-bottom:8px; background:var(--carte); border:1px solid var(--trait); border-radius:4px;\">\n                <div style=\"flex:1; min-width:0; font-size:12.5px; line-height:1.5;\"><strong style=\"display:block; font-weight:600;\">Imprimantes 3D résine grand format<\u002Fstrong><a href=\"#\" style=\"color:var(--attenue); text-decoration:none; font-size:11.5px; word-break:break-word;\">lopmate.com/fr/articles-comparaison<\u002Fa><\u002Fdiv>\n                <button style=\"font:600 11.5px/1.3 var(--sans); padding:7px 13px; border:1px solid var(--accent); border-radius:3px; background:transparent; color:var(--accent); cursor:pointer; white-space:nowrap;\" style-hover=\"background:var(--accent); color:var(--carte)\">Ajouter<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"display:flex; gap:10px; align-items:center; padding:10px 12px; background:var(--vert-pale); border:1px solid var(--vert); border-radius:4px;\">\n                <div style=\"flex:1; min-width:0; font-size:12.5px; line-height:1.5;\"><strong style=\"display:block; font-weight:600;\">Formlabs Form 4L<\u002Fstrong><a href=\"#\" style=\"color:var(--attenue); text-decoration:none; font-size:11.5px; word-break:break-word;\">formlabs.com/fr/3d-printers/form-4l<\u002Fa><\u002Fdiv>\n                <button disabled=\"true\" style=\"font:600 11.5px/1.3 var(--sans); padding:7px 13px; border:1px solid transparent; border-radius:3px; background:transparent; color:var(--vert); cursor:not-allowed; white-space:nowrap;\">✓ Ajoutée<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-for list=\"{{ messages }}\" as=\"m\" hint-placeholder-count=\"0\">\n            <div style=\"max-width:92%; font-size:14px; line-height:1.65; padding:12px 15px; border-radius:4px; align-self:{{ m.align }}; background:{{ m.fond }}; color:{{ m.encre }}; border:1px solid {{ m.bordure }};\">{{ m.texte }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <form sc-camel-on-submit=\"{{ onSubmitQuestion }}\" style=\"padding:16px 20px; border-top:1px solid var(--trait); display:flex; gap:10px;\">\n          <input value=\"{{ question }}\" sc-camel-on-input=\"{{ onQuestion }}\" placeholder=\"Ta question…\" autocomplete=\"off\" style=\"font:400 14px/1.4 var(--sans); flex:1; min-width:0; padding:12px 15px; border:1px solid var(--trait); border-radius:3px; background:var(--fond); color:var(--texte);\" style-focus=\"outline:none; border-color:var(--accent)\">\n          <button type=\"submit\" style=\"font:600 13.5px/1.3 var(--sans); white-space:nowrap; padding:11px 20px; border:1px solid var(--accent); border-radius:3px; background:var(--accent); color:var(--carte); cursor:pointer;\" style-hover=\"opacity:.88\">Envoyer<\u002Fbutton>\n        <\u002Fform>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;afficherTuiles&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Affichage&quot;},&quot;afficherSourceBrute&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Affichage&quot;},&quot;afficherPertinence&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Affichage&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    filtre: 'tous', requete: '', etiquette: null, ajoutOuvert: false,\n    ajoutNom: '', ajoutUrl: '', avancement: null, discussion: false,\n    confirmId: null, urls: {}, etats: {}, question: '', messages: [], fondRempli: false,\n  };\n\n  LIBELLES = { enrichi: 'enrichi', non_trouve: 'sans source', echec: 'échec', en_attente: 'en attente' };\n  TEINTES = ['#4f6b4a', '#3c5a72', '#8a6a2f', '#8f4436', '#5a4a6b', '#2f6a63', '#6b5a3c', '#455060'];\n  STATS = { enrichi: 53, non_trouve: 16, en_attente: 82 };\n\n  DONNEES = [\n    {\n      id: '6127b2d0-6cb3-4f16-a2bc-08b6038b8fb3',\n      nom: 'Adam Harvey — Anti-Fragile Sycophants',\n      note_alex: \"Artiste découvert pour le dossier AI for Good 2026. Essai visuel sur la censure dans les modèles d'IA générative. Créateur de CV Dazzle (2010). Chief Technologist chez Tech 4 Tracing (2025). Pas de prix spécifique pour cette œuvre.\",\n      texte: \"**Anti-Fragile Sycophants**\\n\\n# Anti-Fragile Sycophants\\n\\nFigure 1. Prompt: “Photo of a man giving the middle finger”. Image generated with Adobe Firefly. 2024. Source: [Adam Harvey on tldr.nettime.org](https://tldr.nettime.org/@adam_harvey/112279943082768705)\\n\\nInteracting with generative AI models and finding their failure points is part of how we learn about the digital world that envelopes society today. But as artificial intelligence is increasingly used to censor and monitor unpopular political discourse, understanding how and why it fails will become critical for preserving open dialogue and artistic expression.\\n\\nFor example, the familiar gesture of giving someone the middle finger–a staple of [modern art](https://www.dazeddigital.com/art-photography/article/59549/1/ai-weiwei-middle-finger-power-avant-arte-design-museum-interview) and political speech–should be easily reproducible by today’s AI algorithms. Anything less would be a form of censorship, blocking a basic form of expression. Yet a few simple experiments with popular commercial generative AI services confirmed this limitation: any prompt containing the phrase “giving the middle finger” resulted in closed fists, alternate fingers, or politely mutated hands.\\n\\nWhile technically capable of producing such an image–given the vast amount of profanity present in training datasets like Common Crawl and mainstream media (including pirated books and movies)–the generative models consistently and clearly denied my prompts,\",\n      resume: 'L\\'extrait presente \"Anti-Fragile Sycophants\" d\\'Adam Harvey, qui explore les points de defaillance des modeles d\\'IA generative. Il illustre son propos avec une image generee par Adobe Firefly a partir du prompt \"Photo of a man giving the middle finger\" : les services commerciaux refusent systematiquement ce geste, produisant poings fermes, autres doigts ou mains deformees. Harvey y voit une forme de censure d\\'une expression politique et artistique basique, alors meme que les modeles en seraient techniquement capables vu les donnees d\\'entrainement (Common Crawl, medias, livres et films pirates), et souligne l\\'enjeu de comprendre ces echecs a l\\'heure ou l\\'IA sert a surveiller et censurer les discours politiques.',\n      url: 'https://adam.harvey.studio/anti-fragile-sycophants/',\n      etiquettes: ['ai', 'artiste'],\n      statut: 'enrichi',\n      source_url: 'https://adam.harvey.studio/anti-fragile-sycophants/',\n      source_titre: 'Anti-Fragile Sycophants - Adam Harvey',\n      resume_modele: 'claude-opus-5',\n      pertinence: null,\n      champs_enrichis: ['texte', 'resume'],\n      erreur: null,\n      indexe_le: '2026-09-05T11:47:41.447+00:00',\n    },\n    {\n      id: '63e82663-e942-4650-9c5a-3c0fc923bd99',\n      nom: 'app caféine',\n      note_alex: null,\n      texte: \"Tahoe \\n\\n Tahoe\\n Sequoia\\n Sonoma\\n Ventura\\n Monterey\\n\\n# Caffeine\\n\\nKeeps your Mac awake.\\n\\nCaffeine app icon\\n\\nDownload NowVersion 1.6.4 - 4.5 MB\\n\\nCaffeine is a tiny open source program that puts an icon in the right side of your menubar. Click it to prevent your Mac from automatically going to sleep, dimming the screen or starting screen savers.\\n\\n### Usage\\n\\nCaffeine icon in the macOS menu bar [...] Due to the long period of inactivity for Caffeine, a lot of different and great options have been developed. While the alternatives are great apps and definitely worth your consideration, we believe that Caffeine's power lies in its simplicity and ease of use.\\n\\n### Support\\n\\nIf you have questions, comments or other feedback just get in touch.\\n\\n### Source Code\\n\\nCaffeine is open source software. It's licensed under MIT license and the source code is available on Github. [...] Yes! Tomas Franzén of Lighthead Software originally developed Caffeine in 2006, and it has been a well known and loved utility for Mac users for many years. Its simplicity has allowed it to continue working perfectly long after active development had ceased.  \\n   In 2018, Michael Jones (IntelliScape Computer Solutions) reached out to Tomas to inquire if they could continue development of Caffeine.\",\n      resume: \"Caffeine est un petit programme open source pour Mac (version 1.6.4, 4,5 Mo) qui ajoute une icône dans la partie droite de la barre de menus : un clic empêche l'ordinateur de se mettre en veille, de réduire la luminosité de l'écran ou de lancer l'économiseur d'écran. Distribué sous licence MIT avec le code source disponible sur Github, il est compatible avec les versions de macOS de Monterey à Tahoe. Créé en 2006 par Tomas Franzén (Lighthead Software), son développement a été repris en 2018 par Michael Jones (IntelliScape Computer Solutions) ; sa force reste sa simplicité face aux alternatives apparues entre-temps.\",\n      url: 'https://www.caffeine-app.net/en',\n      etiquettes: [],\n      statut: 'enrichi',\n      source_url: 'https://www.caffeine-app.net/en',\n      source_titre: 'Caffeine - Keeps your Mac awake.',\n      resume_modele: 'claude-opus-5',\n      pertinence: 0.7065353,\n      champs_enrichis: ['url', 'texte', 'resume'],\n l.nom, l.texte, l.resume, l.note_alex, (l.etiquettes || []).join(' ')]\n        .join(' ').toLowerCase().includes(q);\n    });\n\n    const rows = visibles.map((l) => {\n      const lien = l.source_url || l.url;\n      const pertinenceVisible = pertinenceActive && l.pertinence != null;\n      const note = l.note_alex || '';\n      const resume = l.resume || '';\n      const brutVisible = brutActif && !!l.texte;\n      const champs = (l.champs_enrichis && l.champs_enrichis.length) ? l.champs_enrichis.join(', ') : '';\n      const aPied = !!(lien || pertinenceVisible || champs || l.erreur);\n      return {\n        id: l.id,\n        nom: this.nomLisible(l.nom),\n        nomComplet: l.nom || '',\n        teinte: this.teinteStatut(l.statut),\n        statutLibelle: this.LIBELLES[l.statut] || l.statut,\n        etiquettes: (l.etiquettes || []).map((e) => ({\n          nom: e, hue: this.hueEtiquette(e),\n          onClick: () => { this.setState({ etiquette: e }); window.scrollTo({ top: 0, behavior: 'smooth' }); },\n        })),\n        aEtiquettes: (l.etiquettes || []).length > 0,\n        note, resume,\n        resumeTitre: 'Résumé — reformulé par ' + (l.resume_modele || 'le modèle'),\n        texte: l.texte || '', brutVisible,\n        lien: lien || '',\n        lienLibelle: lien ? String(l.source_titre || lien).slice(0, 66) : '',\n        pertinenceVisible,\n        pertinencePc: l.pertinence != null ? Math.round(Number(l.pertinence) * 100) + '%' : '0%',\n        pertinenceTxt: l.pertinence != null ? Number(l.pertinence).toFixed(2) : '',\n        champs, erreur: l.erreur || '',\n        aPied, rien: !note && !resume && !brutVisible && !aPied,\n        relanceLibelle: (l.url ? \"Changer l'adresse\" : 'Renseigner une adresse') + ' et recompléter',\n        urlValue: s.urls[l.id] !== undefined ? s.urls[l.id] : (l.url || ''),\n        onUrl: (e) => this.setState({ urls: Object.assign({}, s.urls, { [l.id]: e.target.value }) }),\n        onRelancer: (e) => {\n          e.p : () => this.setState({ discussion: false }),\n      question: s.question,\n      onQuestion: (e) => this.setState({ question: e.target.value }),\n      messages: s.messages,\n      onSubmitQuestion: (e) => {\n        e.preventDefault();\n        const t = s.question.trim();\n        if (!t) return;\n        this.setState({\n          question: '',\n          messages: s.messages.concat([\n            { texte: t, align: 'flex-end', fond: 'var(--accent)', encre: 'var(--carte)', bordure: 'var(--accent)' },\n            { texte: 'Maquette : cette action nécessite le serveur du projet.', align: 'flex-start', fond: 'var(--ambre-pale)', encre: 'var(--texte)', bordure: 'var(--trait)' },\n          ]),\n        });\n      },\n    };\n  }\n\n  componentDidMount() {\n    this._esc = (e) => { if (e.key === 'Escape' && this.state.discussion) this.setState({ discussion: false }); };\n    document.addEventListener('keydown', this._esc);\n    const guetter = () => {\n      const slot = document.getElementById('fond-bandeau-export');\n      if (!slot) { this._t = setTimeout(guetter, 300); return; }\n      const lire = () => this.setState({ fondRempli: true });\n      lire();\n      this._mo = new MutationObserver(lire);\n      this._mo.observe(slot, { attributes: true, attributeFilter: ['data-filled'] });\n    };\n    guetter();\n  }\n  componentWillUnmount() {\n    document.removeEventListener('keydown', this._esc);\n    clearTimeout(this._t);\n    if (this._mo) this._mo.disconnect();\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
